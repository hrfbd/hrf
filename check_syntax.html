<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Syntax Check</title>
<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  var errHtml = '<h1 style="color:red">ERROR in app.js: ' + msg + '</h1><p>Line: ' + lineNo + '</p>';
  document.body.innerHTML += errHtml;
  return false;
};
</script>
<script src="js/app.js"></script>
</head>
<body>
<h1 id="success">No syntax errors found!</h1>
<script>
  if (typeof showView !== 'undefined') {
    document.body.innerHTML += '<h2 style="color:green">showView is defined!</h2>';
  } else {
    document.body.innerHTML += '<h2 style="color:red">showView is UNDEFINED!</h2>';
  }
</script>
</body>
</html>
